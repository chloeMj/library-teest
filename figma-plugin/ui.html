<!doctype html>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    font-family: Inter, -apple-system, 'Segoe UI', sans-serif;
    font-size: 12px;
  }
  body {
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  p {
    margin: 0;
    line-height: 1.5;
    opacity: 0.75;
  }
  input[type='file'] {
    width: 100%;
  }
  button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #0d99ff;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #log {
    flex: 1;
    min-height: 0;
    overflow: auto;
    white-space: pre-wrap;
    line-height: 1.6;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  .bad {
    color: #e03a2e;
  }
</style>

<p>
  design-tokens 폴더의 json 파일을 모두 고르세요. 이름이 같은 변수는 값만 바뀌고, 없는 변수만 새로
  생깁니다. 지우는 건 없습니다.
</p>

<input id="files" type="file" accept=".json" multiple />
<button id="run" disabled>덮어쓰기</button>
<div id="log"></div>

<script>
  const picker = document.getElementById('files')
  const run = document.getElementById('run')
  const log = document.getElementById('log')

  let picked = []
  let finished = false

  picker.onchange = async () => {
    picked = []
    for (const file of picker.files) {
      picked.push({ name: file.name, text: await file.text() })
    }
    run.disabled = picked.length === 0
    log.textContent = picked.map((f) => f.name).join('\n')
  }

  run.onclick = () => {
    if (finished) {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*')
      return
    }
    run.disabled = true
    log.textContent = '넣는 중…'
    parent.postMessage({ pluginMessage: { type: 'import', files: picked } }, '*')
  }

  onmessage = (event) => {
    const msg = event.data.pluginMessage
    run.disabled = false
    if (msg.type === 'done') {
      finished = true
      run.textContent = '닫기'
    }
    if (msg.type === 'error') {
      log.innerHTML = '<span class="bad">실패: ' + msg.message + '</span>'
      return
    }
    const lines = []
    for (const r of msg.report) {
      lines.push(r.collection + ' · ' + r.mode + '  갱신 ' + r.updated + '  추가 ' + r.created)
      for (const broken of r.brokenAlias) lines.push('  ! 별칭 못 찾음: ' + broken)
    }
    log.textContent = lines.join('\n')
  }
</script>
